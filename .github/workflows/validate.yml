name: Validate template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --requirement tools/platformio/requirements.txt
      - name: Validate tooling syntax
        shell: pwsh
        run: |
          python -m py_compile tools/platformio/pio-workspace-bootstrap.py tools/platformio/pio-workspace-switch.py tools/platformio/maintenance.py
          $files = @('tools/platformio/platformio-common.ps1', 'tools/platformio/project-discovery.ps1', 'tools/platformio/build-all.ps1', 'tools/platformio/maintenance-gui.ps1')
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$file has PowerShell parse errors: $($errors.Message -join '; ')" }
          }
          bash -n tools/platformio/maintenance-gui.sh
          bash -n "PlatformIO Maintenance.command"
          python -c "import json,pathlib; json.loads(pathlib.Path('platformio-workspace.json').read_text(encoding='utf-8')); json.loads(pathlib.Path('.vscode/tasks.json').read_text(encoding='utf-8'))"
      - name: Create synthetic PlatformIO projects
        shell: pwsh
        run: |
          $projects = @(
            'projects/firmware/controller',
            'projects/tests/sensors/tof',
            'projects/misc/demo'
          )
          foreach ($project in $projects) {
            New-Item -ItemType Directory -Force -Path "$project/src" | Out-Null
            "[env:esp32dev]`nplatform = espressif32`nboard = esp32dev`nframework = arduino`n" | Set-Content -LiteralPath "$project/platformio.ini" -Encoding utf8NoBOM
            "void setup() {}`nvoid loop() {}`n" | Set-Content -LiteralPath "$project/src/main.cpp" -Encoding utf8NoBOM
          }

      - name: Validate workspace generation
        shell: pwsh
        run: |
          python tools/platformio/pio-workspace-bootstrap.py .
          python -c "import json,pathlib; d=json.loads(next(pathlib.Path('.pio/workspace').glob('*.code-workspace')).read_text(encoding='utf-8')); names=[x['name'] for x in d['folders'][1:]]; assert names==['FW / controller','PJ / misc / demo','TEST / sensors / tof'], names"
          $listed = @(python tools/platformio/maintenance.py list)
          if ($listed.Count -ne 3) { throw "Expected 3 projects, got $($listed.Count)" }
      - name: Build and repair projects
        shell: pwsh
        run: |
          ./tools/platformio/build-all.ps1
          python tools/platformio/maintenance.py repair projects/firmware/controller
          if (-not (Test-Path -LiteralPath 'projects/firmware/controller/.pio')) { throw 'Repair did not regenerate .pio' }

      - name: Validate external project import
        shell: pwsh
        run: |
          $external = Join-Path $env:RUNNER_TEMP 'external-sample'
          New-Item -ItemType Directory -Force -Path "$external/src", "$external/.git", "$external/.pio", "$external/.vscode" | Out-Null
          "[env:esp32dev]`nplatform = espressif32`nboard = esp32dev`nframework = arduino`n" | Set-Content -LiteralPath "$external/platformio.ini" -Encoding utf8NoBOM
          "void setup() {}`nvoid loop() {}`n" | Set-Content -LiteralPath "$external/src/main.cpp" -Encoding utf8NoBOM
          'junk' | Set-Content -LiteralPath "$external/.git/config" -Encoding utf8NoBOM
          'junk' | Set-Content -LiteralPath "$external/.pio/junk" -Encoding utf8NoBOM
          'junk' | Set-Content -LiteralPath "$external/.vscode/junk" -Encoding utf8NoBOM
          'junk' | Set-Content -LiteralPath "$external/compile_commands.json" -Encoding utf8NoBOM
          'junk' | Set-Content -LiteralPath "$external/test.log" -Encoding utf8NoBOM
          python tools/platformio/maintenance.py import $external projects/tests
          if (Test-Path -LiteralPath 'projects/tests/external-sample/.git') { throw '.git was copied' }
          if (Test-Path -LiteralPath 'projects/tests/external-sample/compile_commands.json') { throw 'compile_commands.json was copied' }
          if (Test-Path -LiteralPath 'projects/tests/external-sample/test.log') { throw 'log was copied' }
          python tools/platformio/pio-workspace-bootstrap.py .
          python -c "import json,pathlib; d=json.loads(next(pathlib.Path('.pio/workspace').glob('*.code-workspace')).read_text(encoding='utf-8')); assert 'TEST / external-sample' in [x['name'] for x in d['folders'][1:]]"
